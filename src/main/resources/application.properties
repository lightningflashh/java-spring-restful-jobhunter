spring.application.name=jobhunter

#config database
###
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/jobhunter
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql: true
###

#config jwt
###
cheesethank.jwt.base64-secret=Your Base64 Secret

# cheesethank.jwt.access-token-validity-in-seconds=86400
cheesethank.jwt.access-token-validity-in-seconds=864000
cheesethank.jwt.refresh-token-validity-in-seconds=8640000
###

#config upload file
###
#default = 1MB
spring.servlet.multipart.max-file-size=50MB  

#default = 10 MB (form data)
spring.servlet.multipart.max-request-size=50MB
###

###
#configuration pagination from 1 instead 0
spring.data.web.pageable.one-indexed-parameters=true
###


#create base uri for upload file
###
cheesethank.upload-file.base-uri=file:///E:/Springboot/Project/RestfulAPI/upload/
###

#config email
###
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL
spring.mail.password=YOUR_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
###